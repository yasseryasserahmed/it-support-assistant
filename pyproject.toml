[project]
name = "it-support-assistant"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "sentence-transformers",
    "numpy",
    "psycopg[binary]",
    "python-dotenv",
    "pgvector",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
